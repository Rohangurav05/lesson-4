<html>
    <head>
        <style>
            .shadow-button {
                background-color: green;
                color: white;
                border: none;
                font-size: 18px;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 16px;
                padding-right: 16px;
                cursor: pointer;
                box-shadow: 4px 3px 5px rgba(0, 0, 0, 0.5);
            }

            .shadow-button:active {
                margin-top: 3px;
                margin-left: 3px;
                box-shadow: none;
            }
        </style>
    </head>
    <body>
        <button class="shadow-button">
            Shadow
        </button>
    </body>
</html>
