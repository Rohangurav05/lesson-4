<html>
    <head>
        <style>
            .start
            {
                background-color: rgb(121 82 179);
                color: white;   
                border: none;
                border-radius: 3px;
                cursor: pointer;
                font-weight: bold;
                padding-bottom: 5px;
                padding-top: 5px;
                padding-left: 15px;
                padding-right: 15px;
            }
            .start:hover
            {
                background-color: rgb(102, 61, 162);
            }
            .download
            {
                color: rgb(108 117 125);
                padding-bottom: 3px;
                padding-top: 3px;
                padding-left: 10px;
                padding-right: 10px;
                font-weight: bold;
                transition: background-color 0.15s, color 0.15s;
            }
            .download:hover
            {
                color: white;
                background-color:rgb(108 117 125) ;
            }
        </style>
    </head>
    <body>
        <button class="start">Get Started</button>
        <button class="download">Download</button>
    </body>
</html>
