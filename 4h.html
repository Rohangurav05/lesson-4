
<!DOCTYPE html>
<html>
<head>
    <title>Pagination</title>

    <style>
        .pagination {
            text-align: center;
            margin-top: 20px;
        }

        .pagination a {
            display: inline-block;
            font-size: 30px;
            margin: 0 8px;
            padding: 10px 15px;
        }

        .pagination button {
            font-size: 25px;
            padding: 15px 20px;
            margin: 0 10px;
            border: 2px solid gray;
            border-radius: 6px;
            background-color: #eee;
        }

        .pagination a {
            color: #302060;
        }
    </style>
</head>

<body>

    <div class="pagination">

        <button>Back</button>

        <a href="#">1</a>
        <a href="#">2</a>
        <a href="#">3</a>
        <a href="#">4</a>
        <a href="#">5</a>

        <button>Next</button>

    </div>

</body>
</html>
