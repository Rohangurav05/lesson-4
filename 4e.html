<html>
    <head>
        <style>
            .company
            {
                background-color: rgb(10 102 194);
                border: none;
                border-radius: 15px;
                padding-bottom: 5px;
                padding-top: 5px;
                padding-left: 15px;
                padding-right: 15px;
                color: white;
                cursor: pointer;
            }
            .company:hover
            {
                background-color: rgb(3, 71, 139) ;
            }
            .save
            {
                background-color: white;
                color: rgb(10 102 194);
                border-radius: 15px;
                border-width: 1px;
                border-style: solid;
                border-color: rgb(10 102 194);
                font-weight: bold;
                box-sizing: 1px;
                border-color: blue;
                padding-bottom: 5px;
                padding-top: 5px;
                padding-left: 15px;
                padding-right: 15px;
                cursor: pointer;
    
                transition: background-color 0.15s, border-width 0.15s;
                
            }
            .save:hover
            {
                
                background-color: rgb(218, 234, 251);
                border-width: 2px;
            }
        </style>
    </head>
    <body>
        <button class="company">Apply on company website</button>
        <button class="save">Save</button>
    </body>
</html>
